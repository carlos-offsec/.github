  <g class="col c28" transform="translate(855,0)"><text y="10" class="bright">1</text><text y="24" class="mid">0</text><text y="38" class="dim">1</text><text y="52" class="faint">0</text><text y="66" class="mid">1</text><text y="80" class="bright">0</text><text y="94" class="dim">1</text><text y="108" class="faint">0</text><text y="122" class="bright">1</text><text y="136" class="dim">0</text><text y="150" class="mid">1</text><text y="164" class="faint">0</text><text y="178" class="bright">1</text><text y="192" class="mid">0</text></g>
  <g class="col c29" transform="translate(880,0)"><text y="10" class="faint">0</text><text y="24" class="dim">1</text><text y="38" class="bright">0</text><text y="52" class="mid">1</text><text y="66" class="faint">0</text><text y="80" class="dim">1</text><text y="94" class="bright">0</text><text y="108" class="mid">1</text><text y="122" class="faint">0</text><text y="136" class="bright">1</text><text y="150" class="dim">0</text><text y="164" class="mid">1</text><text y="178" class="faint">0</text><text y="192" class="bright">1</text></g>

