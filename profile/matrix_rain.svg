<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <style>
      @keyframes fall0 { 0% { transform: translateY(-220px); opacity: 0; } 5% { opacity: 1; } 85% { opacity: 0.6; } 100% { transform: translateY(220px); opacity: 0; } }
      @keyframes fall1 { 0% { transform: translateY(-180px); opacity: 0; } 8% { opacity: 1; } 80% { opacity: 0.5; } 100% { transform: translateY(220px); opacity: 0; } }
      @keyframes fall2 { 0% { transform: translateY(-260px); opacity: 0; } 3% { opacity: 1; } 90% { opacity: 0.7; } 100% { transform: translateY(220px); opacity: 0; } }
      @keyframes fall3 { 0% { transform: translateY(-140px); opacity: 0; } 10% { opacity: 1; } 75% { opacity: 0.4; } 100% { transform: translateY(220px); opacity: 0; } }
      @keyframes fall4 { 0% { transform: translateY(-300px); opacity: 0; } 4% { opacity: 1; } 88% { opacity: 0.6; } 100% { transform: translateY(220px); opacity: 0; } }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 2px #0f0); } 50% { filter: drop-shadow(0 0 8px #0f0) drop-shadow(0 0 16px #00ff4080); } }
      @keyframes titlePulse { 0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 4px #00ff40); } 50% { opacity: 1; filter: drop-shadow(0 0 12px #00ff40) drop-shadow(0 0 24px #00ff4060); } }
      @keyframes scanline { 0% { transform: translateY(-200px); } 100% { transform: translateY(200px); } }

      .bg { fill: #0a0a0a; }
      .col text { font-family: 'Courier New', monospace; font-size: 11px; }
      .col .bright { fill: #00ff41; }
      .col .mid { fill: #00cc33; }
      .col .dim { fill: #008f11; }
      .col .faint { fill: #003b00; }

      .c0  { animation: fall0 3.2s linear infinite; }
      .c1  { animation: fall1 2.8s linear infinite 0.3s; }
      .c2  { animation: fall2 3.5s linear infinite 0.7s; }
      .c3  { animation: fall3 2.5s linear infinite 0.1s; }
      .c4  { animation: fall4 4.0s linear infinite 1.2s; }
      .c5  { animation: fall0 3.0s linear infinite 0.5s; }
      .c6  { animation: fall1 3.3s linear infinite 0.9s; }
      .c7  { animation: fall2 2.7s linear infinite 0.2s; }
      .c8  { animation: fall3 3.8s linear infinite 1.0s; }
      .c9  { animation: fall4 2.9s linear infinite 0.6s; }
      .c10 { animation: fall0 3.4s linear infinite 1.1s; }
      .c11 { animation: fall1 2.6s linear infinite 0.4s; }
      .c12 { animation: fall2 3.1s linear infinite 0.8s; }
      .c13 { animation: fall3 3.6s linear infinite 1.3s; }
      .c14 { animation: fall4 2.4s linear infinite 0.15s; }
      .c15 { animation: fall0 3.7s linear infinite 0.55s; }
      .c16 { animation: fall1 2.3s linear infinite 0.85s; }
      .c17 { animation: fall2 3.9s linear infinite 1.15s; }
      .c18 { animation: fall3 2.2s linear infinite 0.35s; }
      .c19 { animation: fall4 3.3s linear infinite 0.75s; }
      .c20 { animation: fall0 2.8s linear infinite 1.05s; }
      .c21 { animation: fall1 3.5s linear infinite 0.25s; }
      .c22 { animation: fall2 2.6s linear infinite 0.65s; }
      .c23 { animation: fall3 3.2s linear infinite 0.95s; }
      .c24 { animation: fall4 2.9s linear infinite 1.25s; }
      .c25 { animation: fall0 3.6s linear infinite 0.45s; }
      .c26 { animation: fall1 2.5s linear infinite 0.05s; }
      .c27 { animation: fall2 3.4s linear infinite 0.5s; }
      .c28 { animation: fall3 2.7s linear infinite 1.0s; }
      .c29 { animation: fall4 3.1s linear infinite 0.3s; }

      .title-group { animation: titlePulse 3s ease-in-out infinite; }
      .title { font-family: 'Courier New', monospace; font-size: 28px; font-weight: bold; fill: #00ff41; letter-spacing: 4px; }
      .subtitle { font-family: 'Courier New', monospace; font-size: 12px; fill: #00cc33; letter-spacing: 6px; }
      .bracket { fill: #008f11; }
      .scanline { fill: url(#scanGrad); animation: scanline 4s linear infinite; mix-blend-mode: overlay; }
    </style>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#00ff4018"/>
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

